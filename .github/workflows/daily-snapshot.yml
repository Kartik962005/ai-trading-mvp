name: Daily stock snapshot

# Builds the full ~2,142-stock `stock_snapshot` table OFF the web server (here on
# GitHub's runners, which have real RAM and good network) and upserts it into
# Supabase. The live API only ever READS that table, so it never has to scan the
# universe itself. Runs after NSE close on weekdays; also runnable on demand.

on:
  schedule:
    # 11:30 UTC = 17:00 IST, Mon-Fri (NSE closes ~15:30 IST / 10:00 UTC).
    - cron: "30 11 * * 1-5"
  workflow_dispatch: {}

# Avoid overlapping runs if one is slow.
concurrency:
  group: daily-snapshot
  cancel-in-progress: false

jobs:
  build-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build and upsert stock_snapshot
        working-directory: backend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/build_snapshot.py
